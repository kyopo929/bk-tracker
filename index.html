<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BK Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6f7c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Same family as Jino's Tally: nav rail on the left, big display title, quiet tables. Accent: fountain teal. */
:root {
  /* Fallback (Sand & Teal, light). The real colours come from the theme picked in Settings. */
  --bg: #ece5d8; --surface: #fffdf8; --side: #f6f1e7; --ink: #221e17; --muted: #6c6553; --line: #ddd3c1;
  --accent: #0f766e; --accent-soft: #d3ece8; --hover: #f3ede1; --on-accent: #fff;
  --warn: #a15c00; --warn-soft: #fbeed6; --danger: #c4372c; --danger-soft: #fbe5e2; --ok: #1f7a45; --ok-soft: #dff1e6;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.08);
  --font-display: "Bricolage Grotesque", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --pad-y: 10px;
}
:root[data-density="compact"] { --pad-y: 5px; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.app { display: grid; grid-template-columns: 232px 1fr; height: 100%; }
.side { background: var(--side, var(--surface)); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { color: var(--ink); text-decoration: none !important; display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; font: 700 19px/1 var(--font-display); letter-spacing: -.01em; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand-mark svg { width: 18px; height: 18px; stroke-width: 1.7; }
.nav { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
.nav a:hover { background: var(--hover); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .label { flex: 1; }
.nav .count { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--bg); border-radius: 99px; padding: 0 7px; line-height: 18px; }
.nav .count:empty { display: none; }
.nav .count.hot { color: var(--danger); background: var(--danger-soft); font-weight: 600; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 10px; }
.side-foot { border-top: 1px solid var(--line); padding: 12px 16px 14px; font-size: 12px; color: var(--muted); display: grid; gap: 8px; }
.side-foot .row { display: flex; gap: 6px; flex-wrap: wrap; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.head { padding: 24px 32px 4px; display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head h1 { margin: 0; font: 700 28px/1.1 var(--font-display); letter-spacing: -.02em; }
.head .sub { color: var(--muted); padding-bottom: 3px; }
.spacer { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; min-width: 260px; color: var(--muted); }
.search input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; color: var(--ink); }
kbd { font: 11px var(--font-body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 32px 6px; }
.toolbar:empty { display: none; }
.content { flex: 1; overflow: auto; padding: 8px 32px 48px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: default; }
.seg { display: inline-flex; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; gap: 2px; }
.seg button { padding: 4px 11px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.iconbtn { padding: 4px; border-radius: 6px; color: var(--muted); display: inline-grid; place-items: center; }
.iconbtn:hover { background: var(--hover); color: var(--ink); }
.iconbtn.danger:hover { color: var(--danger); }

.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin: 6px 0 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font: 700 24px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.stat.hot .v { color: var(--danger); }

.tbl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.tbl td { padding: var(--pad-y) 12px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl tr:first-child td { border-top: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--hover); }
.tbl tr.muted td { color: var(--muted); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl th.num { text-align: right; }
.tbl .nowrap { white-space: nowrap; }
.tbl input[type=number], .tbl input[type=text], .tbl input[type=date], .tbl select { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 6px; width: 100%; min-width: 60px; }
.tbl input:hover, .tbl select:hover { border-color: var(--line); }
.tbl input:focus, .tbl select:focus { border-color: var(--accent); background: var(--surface); outline: 0; }
.tbl input[type=number] { text-align: right; max-width: 96px; }
.tbl tfoot td { font-weight: 600; border-top: 1px solid var(--line); }
.pn { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.alias { color: var(--muted); font-size: 12px; white-space: nowrap; }
.desc { color: var(--ink); }
.small { font-size: 12px; color: var(--muted); }

.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--hover); color: var(--muted); }
.pill.blue { background: var(--accent-soft); color: var(--accent); }
.pill.green { background: var(--ok-soft); color: var(--ok); }
.pill.amber { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: var(--danger-soft); color: var(--danger); }
.chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 7px; padding: 1px 7px; font-size: 12px; margin: 1px 3px 1px 0; white-space: nowrap; color: var(--ink); }
a.chip:hover { border-color: var(--accent); text-decoration: none; }
.chip b { font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; min-width: 70px; }
.bar i { display: block; height: 100%; background: var(--ok); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
.card h2 { font: 700 17px var(--font-display); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; }
.card h2 .spacer { flex: 1; }
.section-title { display: flex; align-items: center; gap: 10px; margin: 22px 0 8px; }
.section-title h2 { font: 700 17px var(--font-display); margin: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 18px; }
.fields .f .k { font-size: 12px; color: var(--muted); }
.fields .f .v { font-weight: 500; overflow-wrap: anywhere; }
.notes { white-space: pre-wrap; color: var(--ink); margin-top: 10px; }
.empty { color: var(--muted); padding: 28px 4px; text-align: center; }
.crumbs { margin: 0 0 6px; font-size: 13px; }
.flag { color: var(--danger); font-weight: 600; }
.late { color: var(--danger); }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; margin: 0 0 12px; font-size: 13px; }

/* Forms (sheets) */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,14,20,.38); z-index: 35; display: grid; place-items: center; padding: 16px; }
.sheet-bg[hidden] { display: none; }
.sheet { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: min(88vh, 900px); display: flex; flex-direction: column; border: 1px solid var(--line); }
.sheet.wide { width: min(920px, 100%); }
.sheet-head { display: flex; align-items: center; padding: 16px 18px 6px; gap: 10px; }
.sheet-head h2 { margin: 0; flex: 1; font: 700 19px var(--font-display); }
.sheet-body { overflow-y: auto; padding: 6px 18px 8px; }
.sheet-body p { margin: 2px 0 12px; color: var(--muted); }
.sheet-foot { display: flex; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line); align-items: center; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.form label.full { grid-column: 1 / -1; }
.form label.check { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 14px; }
.form input:not([type=checkbox]), .form select, .form textarea, .sheet-body > input, .picker input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--surface); color: var(--ink); width: 100%; }
.form textarea { min-height: 70px; resize: vertical; }
.form input:focus, .form select:focus, .form textarea:focus, .picker input:focus { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.picker .list { max-height: 50vh; overflow: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; }
.picker .opt { display: flex; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--line); width: 100%; text-align: left; align-items: baseline; }
.picker .opt:first-child { border-top: 0; }
.picker .opt:hover, .picker .opt.active { background: var(--accent-soft); }
.err { color: var(--danger); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; z-index: 50; max-width: calc(100% - 32px); }
.toast.bad { background: var(--danger); color: #fff; }
.toast[hidden] { display: none; }

/* Sign-in */
.signin { max-width: 380px; margin: 12vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px; box-shadow: var(--shadow); }
.signin h1 { font: 700 24px var(--font-display); margin: 0 0 6px; }
.signin p { color: var(--muted); margin: 0 0 14px; }
.signin input { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 10px; background: var(--surface); }

/* Phone */
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .head .sub { display: none; }
  .side { min-width: 0; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding: 12px 14px 6px; font-size: 17px; }
  .nav { display: flex; overflow-x: auto; padding: 0 8px 8px; gap: 2px; }
  .nav a { white-space: nowrap; padding: 6px 10px; }
  .nav .count { margin-left: 2px; }
  .nav-sep, .side-foot { display: none; }
  .head { padding: 14px 14px 2px; }
  .head h1 { font-size: 23px; }
  .search { min-width: 0; width: 100%; }
  .toolbar { padding: 8px 14px 4px; }
  .content { padding: 6px 14px 40px; }
  .form { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}

/* Print / Save as PDF: just the content */
@media print {
  .side, .search, .toolbar, .iconbtn, .btn, .sheet-bg, .toast { display: none !important; }
  .app { display: block; } .content { overflow: visible; padding: 0; }
  .tbl-wrap { border: 0; } .tbl th { position: static; }
  body { background: #fff; color: #000; }
}

/* ── Redesign (25 Nov): backlog list, quiet stat strip, order header, settings ── */
.head-gear { margin-bottom: 2px; }
.strip { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 4px 0 18px; overflow: hidden; }
.strip > div { flex: 1 1 130px; padding: 12px 16px; border-left: 1px solid var(--line); margin-left: -1px; }
.strip > div > a { color: inherit; text-decoration: none; display: block; }
.strip b { display: block; font: 700 22px/1.15 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.strip span { font-size: 12px; color: var(--muted); }
.strip .hot b { color: var(--danger); }
.listhead { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 8px; color: var(--muted); font-size: 13px; }
.sortsel { display: inline-flex; gap: 6px; align-items: center; }
.sortsel select { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 3px 6px; }

.backlog { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.bl { display: grid; grid-template-columns: 150px minmax(180px, 1.3fr) minmax(200px, 1.4fr) 82px 58px; gap: 14px; align-items: center; padding: var(--pad-y) 16px; border-top: 1px solid var(--line); cursor: pointer; position: relative; min-height: 44px; }
.backlog.has-staged .bl { grid-template-columns: 150px minmax(180px, 1.3fr) minmax(200px, 1.4fr) 70px 82px 58px; }
.bl:first-child { border-top: 0; }
.bl:not(.bl-head):hover { background: var(--hover); }
.bl.urgent::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--danger); }
.bl-head { cursor: default; min-height: 0; padding-top: 9px; padding-bottom: 9px; font-size: 12px; color: var(--muted); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.bl-head button, .bl-head span { color: var(--muted); font-size: 12px; text-align: left; font-weight: 500; }
.bl-head button.r { text-align: right; }
.bl-head button.on { color: var(--ink); font-weight: 600; }
.bl-head button:hover { color: var(--ink); }
.bl-part { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.tag { font: 600 13.5px/1 var(--font-body); font-variant-numeric: tabular-nums; background: var(--accent-soft); color: var(--accent); padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
.aka { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl-desc { font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl-pos { display: flex; flex-wrap: nowrap; gap: 4px; min-width: 0; overflow: hidden; }
.bl-pos .chip { flex: none; }
.bl-pos .chip { margin: 0; background: var(--bg); border-color: transparent; font-size: 11.5px; padding: 1px 6px; }
.bl-pos .chip.u b { color: var(--danger); }
.bl-pos .chip.more { color: var(--muted); background: none; }
.bl-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bl-owed { font: 700 18px/1 var(--font-display); letter-spacing: -.01em; }
.bl.urgent .bl-owed { color: var(--danger); }
.bl-days { color: var(--muted); font-size: 13px; }
.bl-days.late { color: var(--danger); }
.staged { display: inline-block; background: var(--ok-soft); color: var(--ok); font-weight: 600; font-size: 12.5px; padding: 1px 7px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.hint-bar { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; font-size: 13.5px; line-height: 1.5; }
.hint-bar svg { color: var(--accent); margin-top: 3px; }
.hint-bar a { font-weight: 600; white-space: nowrap; }
.ohead-top { display: flex; align-items: center; gap: 8px; }
.ohead-title { font: 700 22px/1.2 var(--font-display); letter-spacing: -.01em; margin: 8px 0 10px; }
.ohead-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.ohead-progress b { color: var(--ink); }
.bar.big { height: 8px; border-radius: 4px; flex: 0 0 min(320px, 45%); }
.bar i { background: var(--ok); }

.side-foot { gap: 6px; }
.foot-btn { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink); font-size: 14px; margin: 0 -10px; }
.foot-btn:hover { background: var(--hover); }
.who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sheet.settings { width: min(560px, 100%); }
.sheet.settings h3 { font: 600 11.5px var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
.sheet.settings h3:first-child { margin-top: 4px; }
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.theme { display: flex; gap: 10px; align-items: center; text-align: left; padding: 7px 9px; border-radius: 9px; }
.theme:hover { background: var(--hover); }
.theme.on { background: var(--accent-soft); }
.theme b { display: block; font-weight: 500; }
.theme.on b { font-weight: 600; }
.theme small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.25; }
.swatch { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
.swatch i { width: 12px; height: 22px; display: block; }
.seg.wide { display: flex; width: 100%; }
.seg.wide button { flex: 1; padding: 7px 8px; }
.menu-list { display: grid; }
.menu-list button { display: flex; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 8px; text-align: left; }
.menu-list button:hover { background: var(--hover); }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 2px 0 !important; }
@media (max-width: 760px) {
  .bl, .backlog.has-staged .bl { grid-template-columns: 1fr auto auto; gap: 6px 10px; padding: 10px 14px; }
  .bl-head { display: none; }
  .bl-part { grid-column: 1; grid-row: 1; }
  .bl-desc { grid-column: 1 / -1; grid-row: 2; }
  .bl-pos { grid-column: 1 / -1; grid-row: 3; flex-wrap: wrap; }
  .bl-desc { white-space: normal; }
  .bl-owed { grid-column: 3; grid-row: 1; }
  .bl-num:not(.bl-owed):not(.bl-days) { grid-column: 2; grid-row: 1; }
  .bl-days { display: none; }
  .strip > div { flex-basis: 45%; }
  .themes { grid-template-columns: 1fr; }
  .ohead-progress { flex-direction: column; align-items: stretch; }
  .bar.big { flex-basis: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.dropzone { display: flex; gap: 18px; align-items: center; justify-content: space-between; border-style: dashed; }
.dropzone p { max-width: 70ch; }
details.allrows { margin-top: 22px; }
details.allrows summary { cursor: pointer; color: var(--muted); margin-bottom: 8px; }

</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Sections">
    <a class="brand" href="#/outstanding" title="BK Tracker home"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.5 7H6.5a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h8.5a2 2 0 0 0 2-2"/><path d="M8.5 7v2.6a.8.8 0 0 0 .8.8h.9a.8.8 0 0 0 .8-.8V7"/><path d="M17 16.5c-2-2.3-3.6-4.3-3.6-6.4a3.6 3.6 0 0 1 7.2 0c0 2.1-1.6 4.1-3.6 6.4z"/><circle cx="17" cy="10.1" r="1.2"/></svg></span>BK Tracker</a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <header class="head">

  if (table === 'invoices') db.documents.forEach(x => { if (x.invoice_id === id) x.invoice_id = null; });
  derive();
}
async function act(fn, okMsg) {

  catch (e) { console.error(e); toast(friendlyError(e), true); render(); return undefined; }

const group = (arr, key) => { const m = new Map(); for (const x of arr) { const k = x[key]; if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };
function derive() {
  const byId = t => new Map(db[t].map(r => [r.id, r]));
  D = {
    part: byId('parts'), order: byId('orders'), line: byId('order_lines'), delivery: byId('deliveries'), invoice: byId('invoices'),
    numbers: group([...db.part_numbers].sort((a, b) => (b.is_main - a.is_main) || a.number.localeCompare(b.number, undefined, { numeric: true })), 'part_id'),
    partByNumber: new Map(db.part_numbers.map(n => [lc(n.number), n.part_id])),
    linesByOrder: group([...db.order_lines].sort((a, b) => a.sort - b.sort || a.created_at.localeCompare(b.created_at)), 'order_id'),
    linesByPart: group(db.order_lines, 'part_id'),
    dlByLine: group(db.delivery_lines, 'order_line_id'),
    dlByDelivery: group(db.delivery_lines, 'delivery_id'),
    issuesByDelivery: group(db.issues, 'delivery_id'),
    issuesByLine: group(db.issues, 'order_line_id'),
    deliveriesByOrder: group(db.deliveries, 'order_id'),
    invoicesByOrder: group(db.invoices, 'order_id'),
    invoicesByDelivery: group(db.invoices, 'delivery_id'),
    docsByOrder: group(db.documents, 'order_id'),
    docsByDelivery: group(db.documents, 'delivery_id'),
    L: new Map(), O: new Map(),
  };
  const today = todayISO();
  for (const l of db.order_lines) {
    const o = D.order.get(l.order_id) || {};
    const delivered = sum(D.dlByLine.get(l.id) || [], x => x.qty);
    const shipped = (+l.shipped_before || 0) + delivered;
    const outstanding = (l.cancelled || o.closed) ? 0 : Math.max(0, (+l.qty || 0) - shipped);
    const expected = l.expected_date || o.expected_date || null;
    const openIssues = (D.issuesByLine.get(l.id) || []).filter(i => i.status !== 'Resolved').length;
    const staged = outstanding > 0 ? Math.min(+l.staged_qty || 0, outstanding) : 0;
    D.L.set(l.id, { delivered, shipped, outstanding, staged, expected, late: !!(expected && outstanding > 0 && expected < today), age: outstanding > 0 ? daysSince(o.po_date) : null, openIssues });
  }
  for (const o of db.orders) {
    const lines = (D.linesByOrder.get(o.id) || []);
    const active = lines.filter(l => !l.cancelled);
    const ordered = sum(active, l => l.qty);
    const outstanding = sum(active, l => D.L.get(l.id).outstanding);
    const shipped = sum(active, l => Math.min(+l.qty || 0, D.L.get(l.id).shipped));
    let status;
    if (o.closed) status = 'Closed';
    else if (!active.length) status = o.po_number ? 'PO received' : 'Quote sent';
    else if (outstanding === 0) status = 'Fully shipped';
    else if (shipped > 0) status = 'Partially shipped';
    else status = o.po_number ? 'PO received' : 'Quote sent';
    const openIssues = sum((D.deliveriesByOrder.get(o.id) || []), d => (D.issuesByDelivery.get(d.id) || []).filter(i => i.status !== 'Resolved').length);
    D.O.set(o.id, { status, lines: lines.length, ordered, outstanding, shipped, pct: ordered ? shipped / ordered : 0, openIssues, late: lines.some(l => D.L.get(l.id).late), urgent: lines.some(l => l.urgent && D.L.get(l.id).outstanding > 0) });
  }
}
// Which number leads: WET's main number, or the client's (WC) number. Settings → Part numbers.
function firstNumber(pid) {
  const nums = D.numbers.get(pid) || [];
  if (settings.numFirst === 'client') return nums.find(n => n.label === 'client') || nums.find(n => n.label === 'old') || nums[0];
  return nums[0];
}
const mainNo = pid => (firstNumber(pid) || {}).number || '?';
const otherNos = pid => { const f = firstNumber(pid); return (D.numbers.get(pid) || []).filter(n => n !== f).map(n => n.number); };
const partDesc = pid => (D.part.get(pid) || {}).description || '(part deleted)';
const orderName = id => { const o = D.order.get(id); return o ? (o.po_number || o.title) : ''; };
const soOf = id => { const o = D.order.get(id); return o && o.wet_so ? 'SO ' + o.wet_so : ''; };
const STATUS_PILL = { 'Quote sent': '', 'PO received': 'blue', 'Partially shipped': 'amber', 'Fully shipped': 'green', 'Closed': '' };
const statusPill = s => `<span class="pill ${STATUS_PILL[s] || ''}">${esc(s)}</span>`;
const issuePill = s => `<span class="pill ${s === 'Resolved' ? 'green' : s === 'Open' ? 'red' : 'amber'}">${esc(s)}</span>`;
function partCell(pid, used) {
  const others = otherNos(pid);
  const usedNote = used && lc(used) !== lc(mainNo(pid)) ? `<div class="alias">as ${esc(used)}</div>` : '';
  return `<span class="pn">${esc(mainNo(pid))}</span>${others.length ? ` <span class="alias">/ ${others.map(esc).join(' / ')}</span>` : ''}${usedNote}`;
}
// Client numbers carry a "WC" suffix (8481WC = 8481): accept either.
const stripWC = q => q.replace(/\s*wc$/i, '');
const partIdFor = num => D.partByNumber.get(lc(num)) || D.partByNumber.get(lc(stripWC(String(num || '').trim()))) || null;
function matchesPart(pid, q) {
  if (!q) return true;
  const q2 = stripWC(q) || q;
  return (D.numbers.get(pid) || []).some(n => lc(n.number).includes(q) || lc(n.number).includes(q2)) || lc(partDesc(pid)).includes(q);
}

// When the search is an exact number we know, say what it is.
function searchHint(raw) {
  const q = lc(raw.trim()); if (!q) return '';
  const qs = stripWC(q), out = [];
  for (const o of db.orders) {
    const so = lc(o.wet_so);
    if (so && (q === so || q === 'so ' + so || q === 'so' + so)) out.push(`<b>${esc(raw.trim())}</b> is WET’s sales order (SO) number for your <b>${esc(o.po_number || '')}</b> “${esc(o.title)}”. Shipping uses SO numbers; you and the client use PO numbers. <a href="#/orders/${o.id}">Open the order</a>`);
    const po = lc(o.po_number);
    if (po && (q === po || 'po' + q === po)) out.push(`<b>${esc(o.po_number)}</b> is the client’s purchase order “${esc(o.title)}”${o.wet_so ? ` (WET SO ${esc(o.wet_so)})` : ''}. <a href="#/orders/${o.id}">Open the order</a>`);
  }
  for (const d of db.deliveries) if (lc(d.dn_number) === q) out.push(`<b>${esc(d.dn_number)}</b> is a delivery note${d.order_id ? ` for ${esc(orderName(d.order_id))}` : ''}${d.ship_date ? `, shipped ${fmtD(d.ship_date)}` : ''}. <a href="#/deliveries/${d.id}">Open the delivery</a>`);
  const pid = D.partByNumber.get(q) || D.partByNumber.get(qs);
  if (pid) {
    const nums = D.numbers.get(pid) || [];
    const hit = nums.find(n => lc(n.number) === q || lc(n.number) === qs) || {};
    const kind = /wc$/.test(q) ? 'the client’s number' : ({ new: 'WET’s number', old: 'the client’s (old) number', client: 'the client’s number' }[hit.label] || 'a number');
    const others = nums.filter(n => n !== hit).map(n => esc(n.number) + (n.label ? ` (${esc(n.label)})` : ''));
    out.push(`<b>${esc(raw.trim())}</b> is ${kind} for <b>${esc(partDesc(pid))}</b>${others.length ? `, also known as ${others.join(', ')}` : ''}. <a href="#/parts/${pid}">Open the part</a>`);
  }
  return out.length ? `<div class="hint-bar">${ICON.search || ''}<div>${out.join('<br>')}</div></div>` : '';
}

// Generic sortable table that also feeds "Export"
function table(id, cols, rows, opts = {}) {
  const s = ui.sort[id];
  if (s) {
    const c = cols.find(c => c.key === s.key);
    if (c) {
      const val = c.sort || (r => r[c.key]);
      rows = [...rows].sort((a, b) => {
        const x = val(a), y = val(b);
        const cmp = (typeof x === 'number' || typeof y === 'number') ? (x ?? -Infinity) - (y ?? -Infinity) : String(x ?? '').localeCompare(String(y ?? ''), undefined, { numeric: true });
        return s.dir * cmp;
      });
    }
  }
  if (opts.export !== false) exportable = { name: opts.name || id, cols, rows };
  if (!rows.length) return `<div class="tbl-wrap"><div class="empty">${opts.empty || 'Nothing here.'}</div></div>`;
  const head = cols.map(c => `<th class="${c.num ? 'num' : ''}" ${c.nosort ? '' : `data-sort="${id}:${c.key}" style="cursor:pointer"`}>${esc(c.label)}${s && s.key === c.key ? (s.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`).join('');
  const body = rows.map(r => `<tr class="${opts.href ? 'click' : ''} ${opts.rowClass ? opts.rowClass(r) : ''}" ${opts.href ? `data-go="${esc(opts.href(r))}"` : ''}>${cols.map(c => `<td class="${c.num ? 'num' : ''} ${c.cls || ''}">${c.html ? c.html(r) : esc(c.text ? c.text(r) : r[c.key])}</td>`).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${opts.foot || ''}</table></div>`;
}

    { key: 'title', label: 'Order', sort: r => r.o.title, html: r => `${esc(r.o.title)}${r.urgent ? ' <span class="pill red">Urgent</span>' : ''}`, text: r => r.o.title },
    { key: 'date', label: 'PO date', sort: r => r.o.po_date, html: r => `<span class="nowrap">${fmtD(r.o.po_date)}</span>`, text: r => r.o.po_date || '' },
    { key: 'status', label: 'Status', html: r => statusPill(r.status), text: r => r.status },
    { key: 'lines', label: 'Lines', num: true },
    { key: 'outstanding', label: 'Outstanding', num: true, html: r => fmtN(r.outstanding), text: r => r.outstanding },
    { key: 'pct', label: 'Shipped', sort: r => r.pct, nosort: false, html: r => `<div class="bar" title="${Math.round(r.pct * 100)}%"><i style="width:${Math.round(r.pct * 100)}%"></i></div>`, text: r => Math.round(r.pct * 100) + '%' },
    { key: 'openIssues', label: 'Problems', num: true, html: r => r.openIssues ? `<span class="flag">${r.openIssues}</span>` : '', text: r => r.openIssues || '' },
  ], rows, { href: r => '#/orders/' + r.o.id, name: 'Orders', empty: ui.orderFilter === 'open' ? 'No open orders. Switch to "All" to see finished ones.' : 'No orders yet.' });
  return { title: 'Orders', sub: `${rows.length} shown`, tools, html };
};

function orderDetail(id) {
  const o = D.order.get(id);
  if (!o) return { title: 'Order not found', html: '<div class="empty">This order no longer exists. <a href="#/orders">Back to orders</a></div>' };
  const st = D.O.get(id);
  const lines = D.linesByOrder.get(id) || [];
  const dels = (D.deliveriesByOrder.get(id) || []).sort((a, b) => String(a.ship_date).localeCompare(String(b.ship_date)));
  const invs = D.invoicesByOrder.get(id) || [];
  const docs = D.docsByOrder.get(id) || [];
  const issues = dels.flatMap(d => D.issuesByDelivery.get(d.id) || []);
  const f = (k, v) => `<div class="f"><div class="k">${k}</div><div class="v">${v || '–'}</div></div>`;
  const pct = Math.round(st.pct * 100);
  const header = `<div class="card ohead">
    <div class="ohead-top">${statusPill(st.status)}<span class="spacer"></span>
      <button class="btn small" data-act="editOrder" data-id="${id}">${ICON.edit}Edit order</button>
      <button class="iconbtn danger" title="Delete order" data-act="deleteOrder" data-id="${id}">${ICON.trash}</button></div>
    <div class="ohead-title">${esc(o.title)}</div>
    <div class="ohead-progress"><div class="bar big"><i style="width:${pct}%"></i></div><span><b>${fmtN(st.shipped)}</b> of ${fmtN(st.ordered)} shipped · <b>${fmtN(st.outstanding)}</b> owed</span></div>
    <div class="fields">${f('PO number', esc(o.po_number))}${hasSO ? f('WET SO', esc(o.wet_so)) : ''}${f('PO date', fmtD(o.po_date))}${f('Expected', fmtD(o.expected_date))}${f('Quote', esc(o.quote_ref))}${f('Quote sent', fmtD(o.quote_sent))}${f('Client', esc(o.client))}</div>
    ${o.closed ? '<div class="warnbox" style="margin-top:12px">Closed: anything not yet shipped is no longer counted as outstanding.</div>' : ''}
    ${o.notes ? `<div class="notes">${esc(o.notes)}</div>` : ''}</div>`;
  const lineRows = lines.map(l => {
    const c = D.L.get(l.id);
    return `<tr class="click ${l.cancelled ? 'muted' : ''}" data-act="editLine" data-id="${l.id}" title="Click to edit">
      <td>${partCell(l.part_id, l.ordered_as)}<div class="small">${esc(partDesc(l.part_id))}</div></td>
      <td class="num">${fmtN(l.qty)}</td>
      <td class="num">${fmtN(c.shipped)}${+l.shipped_before ? `<div class="alias" title="Shipped before tracking began">${fmtN(l.shipped_before)} earlier</div>` : ''}</td>
      <td class="num"><b>${fmtN(c.outstanding)}</b>${c.openIssues ? ` <span class="flag" title="Open delivery problem">!</span>` : ''}</td>
      ${hasStaged ? `<td class="num">${c.staged ? `<span class="staged">${fmtN(c.staged)}</span>` : ''}</td>` : ''}
      <td>${l.urgent ? '<span class="pill red">Urgent</span>' : ''}${l.cancelled ? '<span class="pill">Cancelled</span>' : ''}</td>
      <td class="nowrap ${c.late ? 'late' : ''}">${fmtD(l.expected_date)}</td>
      <td class="num">${l.unit_price != null ? money(l.unit_price) : ''}</td>
      <td class="small">${esc(l.notes || '')}</td></tr>`;
  }).join('');
  exportable = {
    name: (o.po_number || o.title) + ' lines', cols: [
      { label: 'Part', text: l => mainNo(l.part_id) }, { label: 'Other numbers', text: l => otherNos(l.part_id).join(' / ') }, { label: 'Description', text: l => partDesc(l.part_id) },
      { label: 'Ordered as', text: l => l.ordered_as }, { label: 'Ordered', text: l => l.qty }, { label: 'Shipped before tracking', text: l => l.shipped_before },
      { label: 'Delivered', text: l => D.L.get(l.id).delivered }, { label: 'Outstanding', text: l => D.L.get(l.id).outstanding }, { label: 'Urgent', text: l => l.urgent ? 'Urgent' : '' },
      { label: 'Expected', text: l => l.expected_date || '' }, { label: 'Unit price', text: l => l.unit_price ?? '' }, { label: 'Cancelled', text: l => l.cancelled ? 'Yes' : '' }, { label: 'Notes', text: l => l.notes || '' }],
    rows: lines,
  };
  const linesHtml = `<div class="section-title"><h2>Lines</h2><span class="small">${lines.length} · click a line to edit it</span><span class="spacer"></span>
      <button class="btn small" data-act="pasteLines" data-id="${id}">Paste lines</button><button class="btn small primary" data-act="addLine" data-id="${id}">${ICON.plus}Add line</button></div>
    ${lines.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="min-width:260px">Part</th><th class="num">Ordered</th><th class="num">Shipped</th><th class="num">Owed</th>${hasStaged ? '<th class="num">Staged</th>' : ''}<th></th><th>Expected</th><th class="num">Unit price</th><th>Notes</th></tr></thead><tbody>${lineRows}</tbody>
      <tfoot><tr><td>Total</td><td class="num">${fmtN(st.ordered)}</td><td class="num">${fmtN(st.shipped)}</td><td class="num">${fmtN(st.outstanding)}</td>${hasStaged ? `<td class="num">${fmtN(sum(lines, l => D.L.get(l.id).staged)) || ''}</td>` : ''}<td colspan="4"></td></tr></tfoot></table></div>` : '<div class="tbl-wrap"><div class="empty">No lines yet. Add them one by one, or paste a list.</div></div>'}`;
  const delHtml = `<div class="section-title"><h2>Deliveries</h2><span class="spacer"></span><button class="btn small primary" data-act="newDelivery" data-order="${id}">${ICON.plus}Record delivery</button></div>` +
    (dels.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Delivery note</th><th>Shipped</th><th>Received</th><th class="num">Units</th><th>Tracking</th><th>Problems</th></tr></thead><tbody>${dels.map(d => {
      const n = (D.issuesByDelivery.get(d.id) || []).filter(i => i.status !== 'Resolved').length;
      return `<tr class="click" data-go="#/deliveries/${d.id}"><td class="pn">${esc(d.dn_number)}</td><td class="nowrap">${fmtD(d.ship_date)}</td><td class="nowrap">${fmtD(d.received_date)}</td><td class="num">${fmtN(sum(D.dlByDelivery.get(d.id) || [], x => x.qty))}</td><td>${esc(d.tracking)}</td><td>${n ? `<span class="flag">${n} open</span>` : ''}</td></tr>`;
    }).join('')}</tbody></table></div>` : '<div class="tbl-wrap"><div class="empty">Nothing delivered against this order yet.</div></div>');
  const issHtml = issues.length ? `<div class="section-title"><h2>Problems</h2></div>${issuesTable(issues, false)}` : '';
  const invHtml = `<div class="section-title"><h2>Invoices</h2><span class="spacer"></span><button class="btn small" data-act="newInvoice" data-order="${id}">${ICON.plus}Add invoice</button></div>` +
    (invs.length ? invoicesTable(invs, false) : '<div class="tbl-wrap"><div class="empty">No invoices yet.</div></div>');
  const docHtml = `<div class="section-title"><h2>Documents</h2><span class="spacer"></span><button class="btn small" data-act="newDoc" data-order="${id}">${ICON.plus}Add link</button></div>` + docsTable(docs, false);
  return { title: o.po_number || o.title, sub: `<a href="#/orders">Orders</a> › ${esc(o.title)}`, html: header + linesHtml + delHtml + issHtml + invHtml + docHtml };
}

function deliveryDetail(id) {
  const d = D.delivery.get(id);

  const o = D.order.get(d.order_id);
  const dls = D.dlByDelivery.get(id) || [];
  const issues = D.issuesByDelivery.get(id) || [];
  const f = (k, v) => `<div class="f"><div class="k">${k}</div><div class="v">${v || '–'}</div></div>`;
  const header = `<div class="card"><h2><span>${esc(d.dn_number)}</span><span class="spacer"></span>
      <button class="btn small" data-act="editDelivery" data-id="${id}">${ICON.edit}Edit</button>

      <td class="num"><b>${fmtN(x.qty)}</b></td>
      <td>${l ? `${esc(orderName(l.order_id))} <span class="small">ordered ${fmtN(l.qty)} as ${esc(l.ordered_as || mainNo(l.part_id))}</span>` : '<span class="small">Not matched to an order line</span>'}</td>

  exportable = { name: d.dn_number, cols: [{ label: 'Part', text: x => mainNo(x.part_id) }, { label: 'Description', text: x => partDesc(x.part_id) }, { label: 'Shipped as', text: x => x.shipped_as }, { label: 'Qty received', text: x => x.qty }, { label: 'PO', text: x => orderName((D.line.get(x.order_line_id) || {}).order_id) }, { label: 'Notes', text: x => x.notes || '' }], rows: dls };
  const items = `<div class="section-title"><h2>Items received</h2><span class="small">Good quantity only. Record short, wrong or damaged items as problems below.</span></div>` +
    (dls.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th style="min-width:260px">Part</th><th class="num">Received</th><th>Against</th><th>Notes</th></tr></thead><tbody>${itemRows}</tbody></table></div>` : '<div class="tbl-wrap"><div class="empty">No items yet. Tick them off from the order below.</div></div>');
  let add = '';
  if (o) {
    const open = (D.linesByOrder.get(o.id) || []).filter(l => D.L.get(l.id).outstanding > 0);
    add = `<div class="section-title"><h2>Add items from ${esc(o.po_number || o.title)}</h2><span class="spacer"></span>${open.length ? `<button class="btn small" data-act="fillAll">Fill all outstanding</button><button class="btn small primary" data-act="addDLines" data-id="${id}">${ICON.plus}Add to delivery</button>` : ''}</div>` +
      (open.length ? `<div class="tbl-wrap"><table class="tbl" id="receiveTbl"><thead><tr><th style="min-width:240px">Part</th><th>Ordered as</th><th class="num">Outstanding</th><th class="num">Received now</th><th>Shipped as</th></tr></thead><tbody>${open.map(l => {
        const nums = D.numbers.get(l.part_id) || [];
        const def = nums.find(n => n.is_main)?.number || l.ordered_as;

  return { title: d.dn_number, sub: `<a href="#/deliveries">Deliveries</a> › ${esc(d.dn_number)}`, html: header + items + add + iss + docs };

VIEWS.issues = () => {
  const q = lc(ui.q);
  let rows = [...db.issues];
  if (ui.issueFilter === 'open') rows = rows.filter(i => i.status !== 'Resolved');
  if (q) rows = rows.filter(i => [i.description, i.kind, (D.delivery.get(i.delivery_id) || {}).dn_number].some(v => lc(v).includes(q)) || (D.line.get(i.order_line_id) && matchesPart(D.line.get(i.order_line_id).part_id, q)));
  rows.sort((a, b) => (a.status === 'Resolved') - (b.status === 'Resolved') || b.created_at.localeCompare(a.created_at));
  const tools = `<button class="btn primary" data-act="newIssue">${ICON.plus}Report problem</button><div class="seg"><button data-act="issueFilter" data-v="open" aria-pressed="${ui.issueFilter === 'open'}">Not resolved</button><button data-act="issueFilter" data-v="all" aria-pressed="${ui.issueFilter === 'all'}">All</button></div>`;
  return { title: 'Problems', sub: 'Short, wrong or damaged items on deliveries', tools, html: issuesTable(rows) };
};

function invoiceChecks(inv) {
  const flags = [];
  const d = D.delivery.get(inv.delivery_id);
  if (!d) flags.push(['amber', 'No delivery note']);
  else {
    if (inv.order_id && d.order_id && d.order_id !== inv.order_id) flags.push(['red', 'Delivery is for another PO']);
    if ((D.issuesByDelivery.get(d.id) || []).some(i => i.status !== 'Resolved')) flags.push(['red', 'Delivery has open problems']);
    const dls = D.dlByDelivery.get(d.id) || [];
    const priced = dls.filter(x => D.line.get(x.order_line_id)?.unit_price != null);
    if (priced.length && priced.length === dls.length && inv.amount != null) {
      const value = sum(priced, x => x.qty * D.line.get(x.order_line_id).unit_price);
      if (+inv.amount > value + 0.005) flags.push(['red', `More than delivered value (${money(value)})`]);
    }
  }
  if (!flags.length && d) flags.push(['green', 'Matches']);
  return flags;
}

  }

  const NAMES = { parts: 'Part', part_numbers: 'Part number', orders: 'Order', order_lines: 'Order line', deliveries: 'Delivery', delivery_lines: 'Delivery item', issues: 'Problem', invoices: 'Invoice', documents: 'Document' };

// ───────────────────────── sheets (forms) ─────────────────────────
function openSheet({ title, body, foot, wide, onMount }) {
  const bg = $('#sheet');
  bg.innerHTML = `<div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="iconbtn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sheet-body">${body}</div>${foot ? `<div class="sheet-foot">${foot}</div>` : ''}</div>`;
  bg.hidden = false;
  bg.onclick = e => { if (e.target === bg || e.target.closest('[data-close]')) closeSheet(); };
  if (onMount) onMount(bg.firstElementChild);
  const first = bg.querySelector('[autofocus], input:not([type=hidden]), select, textarea');
  if (first) setTimeout(() => first.focus(), 30);
}
function closeSheet() { const bg = $('#sheet'); bg.hidden = true; bg.innerHTML = ''; }

// fields: [{k, label, type, options, full, required, placeholder}]
function formSheet({ title, intro, fields, values = {}, saveLabel = 'Save', onSave, wide, extraFoot = '' }) {
  fields = fields.filter(f => (!f.needsSO || hasSO) && (!f.needsStaged || hasStaged));
  const input = f => {
    const v = values[f.k] ?? f.default ?? '';
    if (f.type === 'textarea') return `<textarea name="${f.k}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
    if (f.type === 'select') return `<select name="${f.k}">${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
    if (f.type === 'check') return `<input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}>`;
    return `<input name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}" ${f.type === 'number' ? 'step="any"' : ''} ${f.list ? `list="${f.k}-list"` : ''}>${f.list ? `<datalist id="${f.k}-list">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}`;
  };
  openSheet({
    title, wide,
    body: `${intro ? `<p>${intro}</p>` : ''}<form class="form" id="sheetForm" autocomplete="off">${fields.map(f => f.type === 'check' ? `<label class="check ${f.full ? 'full' : ''}">${input(f)}${esc(f.label)}</label>` : `<label class="${f.full ? 'full' : ''}">${esc(f.label)}${f.required ? ' *' : ''}${input(f)}</label>`).join('')}<button type="submit" hidden></button></form><div class="err" id="sheetErr"></div>`,
    foot: `${extraFoot}<span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="sheetSave">${esc(saveLabel)}</button>`,
    onMount: el => {
      const form = $('#sheetForm', el);
      const submit = async e => {
        e && e.preventDefault();
        const out = {};
        for (const f of fields) {
          const node = form.elements[f.k];
          let v = f.type === 'check' ? node.checked : node.value.trim();
          if (f.type === 'number') v = v === '' ? null : +v;
          if (f.type === 'date' || f.type === 'select' || f.type === 'text' || f.type === 'textarea' || !f.type) v = v === '' ? null : v;
          if (f.required && (v === null || v === '')) { $('#sheetErr', el).textContent = `${f.label} is needed.`; node.focus(); return; }
          out[f.k] = v;
        }
        const btn = $('#sheetSave', el); btn.disabled = true;
        try { await onSave(out); closeSheet(); render(); }
        catch (err) { console.error(err); $('#sheetErr', el).textContent = friendlyError(err); btn.disabled = false; }
      };
      form.onsubmit = submit;
      $('#sheetSave', el).onclick = submit;
    },
  });
}

function confirmSheet(title, text, okLabel, onOk, danger = true) {
  openSheet({ title, body: `<p>${text}</p><div class="err" id="sheetErr"></div>`, foot: `<span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="okBtn">${esc(okLabel)}</button>`,
    onMount: el => { $('#okBtn', el).onclick = async () => { $('#okBtn', el).disabled = true; try { await onOk(); closeSheet(); render(); } catch (e) { $('#sheetErr', el).textContent = friendlyError(e); $('#okBtn', el).disabled = false; } }; } });
}

// Part picker: type any number or words of the description. Resolves {part_id, number}
function pickPart(title, { allowNew = true, exclude } = {}) {
  return new Promise(resolve => {
    let active = 0, results = [];
    const search = q => {
      q = lc(q.trim()); if (/\dwc$/.test(q)) q = stripWC(q);
      const out = [];
      for (const p of db.parts) {
        if (p.id === exclude) continue;
        const nums = D.numbers.get(p.id) || [];
        let score = -1, hit = null;
        for (const n of nums) { const v = lc(n.number); if (v === q) { score = 100; hit = n.number; break; } if (q && v.startsWith(q)) { score = Math.max(score, 60); hit = hit || n.number; } else if (q && v.includes(q)) { score = Math.max(score, 40); hit = hit || n.number; } }
        if (score < 0 && q && q.split(/\s+/).every(w => lc(p.description).includes(w))) score = 20;
        if (!q) score = 1;
        if (score >= 0) out.push({ p, score: score - (p.archived ? 5 : 0), hit: hit || mainNo(p.id) });
      }
      return out.sort((a, b) => b.score - a.score || mainNo(a.p.id).localeCompare(mainNo(b.p.id), undefined, { numeric: true })).slice(0, 60);
    };
    const draw = el => {
      const q = $('#pq', el).value;
      results = search(q);
      active = Math.min(active, Math.max(0, results.length - 1));
      $('.list', el).innerHTML = results.map((r, i) => `<button class="opt ${i === active ? 'active' : ''}" data-i="${i}"><span class="pn">${esc(r.hit)}</span><span class="desc" style="flex:1">${esc(r.p.description)}${r.p.archived ? ' <span class="pill">Archived</span>' : ''}</span><span class="alias">${esc((D.numbers.get(r.p.id) || []).map(n => n.number).filter(n => n !== r.hit).join(' / '))}</span></button>`).join('')
        + (allowNew && q.trim() && !results.some(r => r.score === 100) ? `<button class="opt" data-new="1"><span class="pn">${ICON.plus}</span><span>New part “${esc(q.trim())}”…</span></button>` : '')
        || '<div class="empty">No match.</div>';
    };
    openSheet({
      title, wide: true,
      body: `<div class="picker"><input id="pq" placeholder="Type a part number (old or new) or words from the description" autocomplete="off"><div class="list"></div></div>`,
      onMount: el => {
        const inp = $('#pq', el);
        inp.oninput = () => { active = 0; draw(el); };
        inp.onkeydown = e => {
          if (e.key === 'ArrowDown') { active = Math.min(active + 1, results.length - 1); draw(el); e.preventDefault(); }
          if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); draw(el); e.preventDefault(); }
          if (e.key === 'Enter' && results[active]) { e.preventDefault(); const r = results[active]; closeSheet(); resolve({ part_id: r.p.id, number: r.hit }); }
        };
        $('.list', el).onclick = e => {
          const b = e.target.closest('.opt'); if (!b) return;
          if (b.dataset.new) { const num = inp.value.trim(); closeSheet(); newPartSheet(num).then(p => resolve(p ? { part_id: p.id, number: num } : null)); return; }
          const r = results[+b.dataset.i]; closeSheet(); resolve({ part_id: r.p.id, number: r.hit });
        };
        draw(el);
      },
    });
    const bg = $('#sheet'); const prev = bg.onclick;
    bg.onclick = e => { if (e.target === bg || e.target.closest('[data-close]')) { closeSheet(); resolve(null); } else if (prev) prev(e); };
  });
}

function newPartSheet(number = '', description = '') {
  return new Promise(resolve => {
    formSheet({
      title: 'New part', intro: 'Add other numbers (old, new, client) on the part’s page afterwards.',
      fields: [{ k: 'number', label: 'Part number', required: true }, { k: 'label', label: 'Number type', type: 'select', options: [['', '—'], 'new', 'old', 'client', 'supplier'] }, { k: 'description', label: 'Description', required: true, full: true }, { k: 'notes', label: 'Notes', type: 'textarea', full: true }],
      values: { number, description },
      onSave: async v => {
        if (D.partByNumber.has(lc(v.number))) throw new Error(`${v.number} already belongs to "${partDesc(D.partByNumber.get(lc(v.number)))}".`);
        const p = await ins('parts', { description: v.description, notes: v.notes });
        try { await ins('part_numbers', { part_id: p.id, number: v.number, label: v.label, is_main: true }); }
        catch (e) { await del('parts', p.id); throw e; }
        toast('Part added'); resolve(p);
      },
    });
    const bg = $('#sheet'); const prev = bg.onclick;
    bg.onclick = e => { if (e.target === bg || e.target.closest('[data-close]')) { closeSheet(); resolve(null); } else if (prev) prev(e); };
  });
}

function pasteLinesSheet(orderId) {
  openSheet({
    title: 'Paste lines', wide: true,
    body: `<p>One line per row: <b>part number</b> then <b>quantity</b>. Copying two columns from Excel or the PO works. Add <code>urgent</code> anywhere on a row to flag it. New numbers can be created with the text after the quantity as the description.</p>
      <div class="form"><label class="full">Lines<textarea id="pasteBox" style="min-height:180px;font-family:ui-monospace,Consolas,monospace" placeholder="09110  500  urgent&#10;40-04743  50&#10;1167  3000"></textarea></label></div><div id="pastePreview"></div><div class="err" id="sheetErr"></div>`,
    foot: `<span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="pasteGo" disabled>Add lines</button>`,
    onMount: el => {
      let parsed = [];
      const parse = () => {
        parsed = $('#pasteBox', el).value.split(/\r?\n/).map(s => s.trim()).filter(Boolean).map(s => {
          const toks = (s.includes('\t') ? s.split('\t') : s.split(/\s+/)).map(x => x.trim()).filter(Boolean);
          const number = toks[0];
          const qi = toks.findIndex((x, i) => i > 0 && /^\d[\d,]*(\.\d+)?$/.test(x));
          const qty = qi > 0 ? +toks[qi].replace(/,/g, '') : null;
          const urgent = toks.some((x, i) => i > 0 && /^urgent$/i.test(x));
          const desc = toks.filter((x, i) => i > 0 && i !== qi && !/^urgent$/i.test(x)).join(' ');
          return { raw: s, number, qty, urgent, desc, part_id: partIdFor(number) };
        });
        $('#pastePreview', el).innerHTML = parsed.length ? `<div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><thead><tr><th>Number</th><th class="num">Qty</th><th>Part found</th><th>Urgent</th></tr></thead><tbody>${parsed.map(r => `<tr><td class="pn">${esc(r.number)}</td><td class="num">${r.qty === null ? '<span class="flag">?</span>' : fmtN(r.qty)}</td><td>${r.part_id ? `${partCell(r.part_id)} <span class="small">${esc(partDesc(r.part_id))}</span>` : `<span class="pill amber">New part</span> ${esc(r.desc || '(no description)')}`}</td><td>${r.urgent ? '<span class="pill red">Urgent</span>' : ''}</td></tr>`).join('')}</tbody></table></div>` : '';
        $('#pasteGo', el).disabled = !parsed.length || parsed.some(r => r.qty === null);
      };
      $('#pasteBox', el).oninput = parse;
      $('#pasteGo', el).onclick = async () => {
        $('#pasteGo', el).disabled = true;
        try {
          for (const r of parsed.filter(r => !r.part_id)) {
            if (partIdFor(r.number)) { r.part_id = partIdFor(r.number); continue; }
            const p = await ins('parts', { description: r.desc || '(add description)' });
            await ins('part_numbers', { part_id: p.id, number: r.number, is_main: true });
            r.part_id = p.id;
          }
          const start = (D.linesByOrder.get(orderId) || []).length;
          await ins('order_lines', parsed.map((r, i) => ({ order_id: orderId, part_id: r.part_id, ordered_as: r.number, qty: r.qty, urgent: r.urgent, sort: start + i })));
          closeSheet(); toast(`${parsed.length} lines added`); render();
        } catch (e) { $('#sheetErr', el).textContent = friendlyError(e); $('#pasteGo', el).disabled = false; }
      };
    },
  });
}

function exportCSV() {
  if (!exportable) return;
  const cell = v => { v = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(v) || /^[=+\-@]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [exportable.cols.filter(c => c.label).map(c => cell(c.label)).join(',')];
  for (const r of exportable.rows) lines.push(exportable.cols.filter(c => c.label).map(c => cell(c.text ? c.text(r) : r[c.key])).join(','));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `BK ${exportable.name} ${todayISO()}.csv`.replace(/[\\/:*?"<>|]/g, '-');
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function settingsSheet() {
  const mode = resolvedMode();
  const sw = (k, t) => { const c = t[mode]; return `<span class="swatch"><i style="background:${c.bg}"></i><i style="background:${c.surface}"></i><i style="background:${c.accent}"></i></span>`; };
  const themeBtn = ([k, t]) => `<button class="theme ${settings.theme === k ? 'on' : ''}" data-act="setTheme" data-v="${k}">${sw(k, t)}<span><b>${esc(t.name)}</b><small>${esc(t.note)}</small></span></button>`;
  const all = Object.entries(THEMES);
  const seg = (act, cur, opts) => `<div class="seg wide">${opts.map(([v, l]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`).join('')}</div>`;
  const body = `
    <h3>Themes</h3><div class="themes">${all.filter(([, t]) => !t.popular).map(themeBtn).join('')}</div>
    <h3>Popular colour schemes</h3><div class="themes">${all.filter(([, t]) => t.popular).map(themeBtn).join('')}</div>

    <h3>Part number shown first</h3>${seg('setNumFirst', settings.numFirst, [['wet', 'WET number (09110)'], ['client', 'Client number (8481)']])}
    <p class="hint">Every number still works in search. This only changes which one leads on screen and in exports.</p>
    <h3>Rows</h3>${seg('setDensity', settings.density, [['comfortable', 'Comfortable'], ['compact', 'Compact']])}
    <h3>Outstanding screen opens</h3>${seg('setHome', settings.home, [['part', 'By part'], ['line', 'By PO line']])}
    <h3>Your data</h3>
    <div class="menu-list">
      <button data-act="backup">${ICON.down}<span>Download a full backup (all tables, one file)</span></button>
      <button data-act="reload">${ICON.swap}<span>Reload from the database</span></button>
      <button data-act="goHistory">${ICON.clock}<span>Change history</span></button>
      <button data-act="signout">${ICON.out}<span>Sign out (${esc(user ? user.email : '')})</span></button>
    </div>
    <p class="hint">Settings are saved in this browser. Data lives in Supabase and is the same everywhere.</p>`;

  openSheet({ title: 'Settings', body });

}

async function backupAll() {
  try {
    await loadAll();
    const hist = await sb.from('history').select('*').order('at', { ascending: false }).limit(5000);
    const blob = new Blob([JSON.stringify({ app: 'BK Tracker', exported: new Date().toISOString(), tables: { ...db, history: hist.data || [] } }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `BK Tracker backup ${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup downloaded');
  } catch (e) { toast(friendlyError(e), true); }
}

// ───────────────────────── events ─────────────────────────
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && ACTIONS[a.dataset.act]) { e.preventDefault(); ACTIONS[a.dataset.act](a); return; }
  if (e.target.closest('[data-stop], a, input, select, textarea, button')) return;
  const s = e.target.closest('[data-sort]');
  if (s) { const [id, key] = s.dataset.sort.split(':'); const cur = ui.sort[id]; ui.sort[id] = { key, dir: cur && cur.key === key ? -cur.dir : 1 }; render(); return; }
  const g = e.target.closest('[data-go]');
  if (g) go(g.dataset.go);
});
// Inline edits: save when the field loses focus / changes
document.addEventListener('change', e => {
  const sel = e.target.closest('[data-act-change]');
  if (sel) { ui[sel.dataset.actChange] = sel.value; render(); return; }
  const el = e.target.closest('[data-edit]'); if (!el) return;
  const [table, id, field] = el.dataset.edit.split(':');
  let v = el.type === 'checkbox' ? el.checked : el.value.trim();
  if (el.type === 'number') { v = v === '' ? (field === 'qty' || field === 'shipped_before' ? 0 : null) : +v; if (v !== null && (isNaN(v) || v < 0)) { toast('Use a number of 0 or more.', true); render(); return; } }
  else if (v === '' && el.type !== 'checkbox') v = null;
  if (table === 'part_numbers' && field === 'number') {
    if (!v) { toast('A part number can’t be blank.', true); render(); return; }
    const other = D.partByNumber.get(lc(v)); const me = db.part_numbers.find(n => n.id === id);
    if (other && lc(v) !== lc(me.number)) { toast(`${v} already belongs to ${mainNo(other)}. Use “Merge” if they are the same part.`, true); render(); return; }
  }
  const patch = { [field]: v };
  if (table === 'issues' && field === 'status') patch.resolved_date = v === 'Resolved' ? todayISO() : null;
  act(() => upd(table, id, patch), 'Saved');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) { closeSheet(); return; }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#sheet').hidden) { e.preventDefault(); $('#search').focus(); }
});

/* Compare with shipping's pending parts list (BDTP "Pending Parts List" Excel).
   The file is read here in the browser; nothing is uploaded anywhere. */
'use strict';

// ── Minimal .xlsx reader: an .xlsx is a zip of XML files ──
async function readXlsx(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const dv = new DataView(buf.buffer);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('This doesn’t look like an Excel (.xlsx) file.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(buf.subarray(p + 46, p + 46 + nlen));
    files[name] = { method, csize, off };
    p += 46 + nlen + xlen + clen;
  }
  const text = async name => {
    const f = files[name] || files[name.replace(/^\//, '')]; if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const raw = buf.subarray(start, start + f.csize);
    if (f.method === 0) return new TextDecoder().decode(raw);
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(stream).text();
  };
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const shared = [];
  const ss = await text('xl/sharedStrings.xml');
  if (ss) for (const si of xml(ss).getElementsByTagName('si')) shared.push([...si.getElementsByTagName('t')].map(t => t.textContent).join(''));
  const rels = {};
  for (const r of xml(await text('xl/_rels/workbook.xml.rels')).getElementsByTagName('Relationship')) rels[r.getAttribute('Id')] = r.getAttribute('Target');
  const sheets = [];
  for (const sh of xml(await text('xl/workbook.xml')).getElementsByTagName('sheet')) {
    const rid = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = rels[rid] || ''; target = target.startsWith('/') ? target.slice(1) : 'xl/' + target;
    const body = await text(target); if (!body) continue;
    const rows = [];
    for (const row of xml(body).getElementsByTagName('row')) {
      const out = [];
      for (const c of row.getElementsByTagName('c')) {
        const ref = c.getAttribute('r') || ''; let col = 0;
        for (const ch of ref.replace(/\d+/g, '')) col = col * 26 + ch.charCodeAt(0) - 64;
        const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
        let val = null;
        if (t === 's') val = shared[+v.textContent];
        else if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
        else if (t === 'b') val = v && v.textContent === '1';
        else if (v) val = t === 'str' || t === 'e' ? v.textContent : +v.textContent;
        out[(col || out.length + 1) - 1] = val;
      }
      rows[(+row.getAttribute('r') || rows.length + 1) - 1] = out;
    }
    sheets.push({ name: sh.getAttribute('name'), rows });
  }
  return sheets;
}

// ── Find shipping's lines in the workbook ──
function parseShippingList(sheets) {
  for (const sh of sheets) {
    const rows = sh.rows;
    for (let h = 0; h < Math.min(rows.length, 30); h++) {
      const head = (rows[h] || []).map(v => lc(v));
      const col = re => head.findIndex(x => re.test(x || ''));
      const c = { po: col(/^po\b|po number/), so: col(/^so\b|so number/), item: col(/item number|wet id/), wc: col(/wetcare|client/), desc: col(/desc/),
        qty: col(/qty pending|pending|outstanding/), staged: col(/^staged$/), sqty: col(/staged qty/), eta: col(/lead time|eta/), wcfr: col(/wcfr/), rem: col(/remark/) };
      if (c.po < 0 || c.item < 0 || c.qty < 0) continue;
      const lines = [];
      for (let r = h + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        const po = String(row[c.po] ?? '').trim();
        if (!/^\d{6,}$/.test(po)) continue;
        const so = String(row[c.so] ?? '').trim();
        const item = String(row[c.item] ?? '').trim();
        const wcs = String(c.wc >= 0 ? row[c.wc] ?? '' : '').split(/[,;/]/).map(x => x.trim().replace(/\s*wc$/i, '')).filter(x => /^[\w.-]+$/.test(x) && !/^(none|n\/?a|closed)$/i.test(x));
        const stagedFlag = c.staged >= 0 && String(row[c.staged] ?? '').trim() !== '';
        lines.push({ row: r + 1, po: 'PO' + po, so: /^\d+$/.test(so) ? so : '', notOnSO: !/^\d+$/.test(so), item: /not on|^none$/i.test(item) ? '' : item, wcs,
          desc: String(row[c.desc] ?? ''), qty: +row[c.qty] || 0, staged: stagedFlag ? (+row[c.sqty] || 0) : 0, eta: c.eta >= 0 ? row[c.eta] ?? '' : '', remark: c.rem >= 0 ? String(row[c.rem] ?? '') : '' });
      }
      if (lines.length) return { sheet: sh.name, lines };
    }
  }
  throw new Error('Couldn’t find shipping’s table in this file. It needs columns like “PO Number”, “Item Number” and “Qty Pending”.');
}

// ── Match against the app ──
const words = s => new Set(lc(s).replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length >= 4 && !/^(with|assembly|assy|inch)$/.test(w)));
function compareShipping(list) {
  const res = [], used = new Set(), poSeen = new Set();
  const orderByPO = new Map(db.orders.filter(o => o.po_number).map(o => [lc(o.po_number), o]));
  for (const s of list.lines) {
    const o = orderByPO.get(lc(s.po));
    poSeen.add(lc(s.po));
    const r = { s, o, line: null, kind: '', add: [], stagedChange: null, probable: false };
    if (!o) { r.kind = 'noPO'; res.push(r); continue; }
    if (s.notOnSO) { r.kind = 'notOnSO'; }
    const nums = [s.item, ...s.wcs].filter(Boolean);
    const pids = new Set(nums.map(n => partIdFor(n)).filter(Boolean));
    const lines = (D.linesByOrder.get(o.id) || []).filter(l => !used.has(l.id) && !l.cancelled);
    let cands = lines.filter(l => pids.has(l.part_id));
    cands.sort((a, b) => Math.abs(D.L.get(a.id).outstanding - s.qty) - Math.abs(D.L.get(b.id).outstanding - s.qty) || D.L.get(b.id).outstanding - D.L.get(a.id).outstanding);
    let line = cands[0];
    if (!line && pids.size) {
      // Shipping's number is a part the app knows, but this PO has no line for it: likely a typo on one side.
      const w = words(s.desc);
      const guess = lines.filter(l => D.L.get(l.id).outstanding === s.qty).map(l => ({ l, score: [...words(partDesc(l.part_id))].filter(x => w.has(x)).length })).filter(x => x.score > 0).sort((a, b) => b.score - a.score)[0];
      r.kind = r.kind || 'mixup'; r.shipPart = [...pids][0];
      if (guess) { used.add(guess.l.id); r.line = guess.l; }
      res.push(r); continue;
    }
    if (!line) {
      const w = words(s.desc);
      const probable = lines.filter(l => D.L.get(l.id).outstanding === s.qty)
        .map(l => ({ l, score: [...words(partDesc(l.part_id))].filter(x => w.has(x)).length })).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
      if (probable.length) { line = probable[0].l; r.probable = true; }
    }
    if (line) {
      used.add(line.id); r.line = line;
      const c = D.L.get(line.id);
      if (!r.kind) r.kind = c.outstanding === s.qty ? 'match' : 'qty';
      const known = new Set((D.numbers.get(line.part_id) || []).map(n => lc(n.number)));
      r.add = nums.filter(n => !known.has(lc(n)) && !partIdFor(n)).map(n => ({ number: n, label: n === s.item ? 'new' : 'client' }));
      if (hasStaged) { const cur = +line.staged_qty || 0; if (cur !== s.staged) r.stagedChange = { from: cur, to: s.staged }; }
    } else if (!r.kind) r.kind = 'shipOnly';
    res.push(r);
  }
  const appOnly = db.order_lines.filter(l => !used.has(l.id) && D.L.get(l.id).outstanding > 0 && poSeen.has(lc((D.order.get(l.order_id) || {}).po_number)));
  const openPOs = new Set(db.order_lines.filter(l => D.L.get(l.id).outstanding > 0).map(l => lc((D.order.get(l.order_id) || {}).po_number)));
  const posMissing = [...openPOs].filter(po => po && !poSeen.has(po)).map(po => orderByPO.get(po)).filter(Boolean);
  const soChanges = [];
  for (const po of poSeen) {
    const o = orderByPO.get(po); if (!o || !hasSO) continue;
    const so = (list.lines.find(s => lc(s.po) === po && s.so) || {}).so;
    if (so && o.wet_so !== so) soChanges.push({ o, so });
  }
  return { res, appOnly, posMissing, soChanges };
}

const SHIP_KIND = {
  match: ['green', 'Match'], qty: ['red', 'Qty differs'], notOnSO: ['red', 'Not on shipping’s SO'],
  shipOnly: ['amber', 'Only on shipping’s list'], noPO: ['amber', 'PO not in the app'], mixup: ['red', 'Part number mix-up'],
};
VIEWS.compare = () => {
  const C = ui.compare;
  const intro = `<div class="card dropzone" id="dropzone">
      <div><b>Compare with shipping’s pending parts list</b><p class="small" style="margin:4px 0 0">Choose or drop the Excel file shipping sends (the BDTP “Pending Parts List”). It’s read here in your browser and checked line by line against the app: PO, part (any WET, client or old number) and quantity.</p></div>
      <label class="btn primary">${ICON.down}Choose file…<input type="file" id="shipFile" accept=".xlsx" hidden></label></div>`;
  if (!C) return { title: 'Shipping check', sub: 'Does shipping’s list agree with yours?', html: intro };
  if (C.error) return { title: 'Shipping check', html: intro + `<div class="warnbox">${esc(C.error)}</div>` };
  const { res, appOnly, posMissing, soChanges } = compareShipping(C.list);
  const count = k => res.filter(r => r.kind === k).length;
  const adds = res.flatMap(r => r.line && (!r.probable || C.acceptProbable.has(r.s.row)) ? r.add.map(a => ({ ...a, r })) : []);
  const staged = res.filter(r => r.stagedChange);
  const probable = res.filter(r => r.probable);
  const problems = res.filter(r => ['qty', 'notOnSO', 'shipOnly', 'noPO', 'mixup'].includes(r.kind));
  const strip = `<div class="strip">
    <div><b>${res.length}</b><span>lines on shipping’s list</span></div>
    <div><b>${count('match')}</b><span>match</span></div>
    <div class="${problems.length ? 'hot' : ''}"><b>${problems.length}</b><span>need a look</span></div>
    <div class="${appOnly.length ? 'hot' : ''}"><b>${appOnly.length}</b><span>open in the app, not on their list</span></div>
    <div><b>${adds.length + staged.length + soChanges.length}</b><span>updates ready</span></div>
  </div>`;
  const shipCell = r => `<span class="pn">${esc(r.s.item || '–')}</span>${r.s.wcs.length ? `<div class="alias">${r.s.wcs.map(w => esc(w) + 'WC').join(', ')}</div>` : ''}`;
  const appCell = r => r.line ? `${partCell(r.line.part_id)}<div class="small">${esc(partDesc(r.line.part_id))}</div>` : '<span class="small">–</span>';
  const rowsHtml = list => list.map(r => `<tr>
      <td>${(([c, t]) => `<span class="pill ${c}">${t}</span>`)(SHIP_KIND[r.kind])}${r.probable ? ' <span class="pill blue" title="Matched by description and quantity">Probable</span>' : ''}</td>
      <td class="nowrap">${esc(r.s.po)}${r.s.so ? `<div class="alias">SO ${esc(r.s.so)}</div>` : ''}</td>
      <td>${shipCell(r)}<div class="small">${esc(r.s.desc)}</div></td><td>${appCell(r)}</td>
      <td class="num">${fmtN(r.s.qty)}</td><td class="num">${r.line ? fmtN(D.L.get(r.line.id).outstanding) : '–'}</td>
      <td class="small">${r.kind === 'mixup' ? `Shipping’s number is your part <b>${esc(mainNo(r.shipPart))}</b> ${esc(partDesc(r.shipPart))}${r.line ? `, but this PO’s line is ${esc(mainNo(r.line.part_id))}. If shipping is right, open the order, click the line and use “Change part”.` : ', which isn’t on this PO.'} ` : ''}${esc(r.s.remark)}${r.o ? ` <a href="#/orders/${r.o.id}">Open order</a>` : ''}</td></tr>`).join('');
  const head = '<thead><tr><th>Result</th><th>PO</th><th>Shipping has</th><th>App has</th><th class="num">Shipping pending</th><th class="num">App owed</th><th>Note</th></tr></thead>';
  let html = strip;
  html += `<div class="section-title"><h2>Need a look</h2><span class="small">${problems.length ? 'Quantities or lines that disagree. Decide which is right, then fix it in the order (or tell shipping).' : 'Nothing: every line on their list matches a line in the app.'}</span></div>`;
  if (problems.length) html += `<div class="tbl-wrap"><table class="tbl">${head}<tbody>${rowsHtml(problems)}</tbody></table></div>`;
  if (appOnly.length || posMissing.length) {
    html += `<div class="section-title"><h2>Open in the app but not on their list</h2><span class="small">Shipping may have missed these, or they were shipped. Check before chasing.</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>PO</th><th>Part</th><th class="num">App owed</th><th></th></tr></thead><tbody>${appOnly.map(l => `<tr><td>${esc(orderName(l.order_id))}</td><td>${partCell(l.part_id)}<div class="small">${esc(partDesc(l.part_id))}</div></td><td class="num">${fmtN(D.L.get(l.id).outstanding)}</td><td><a href="#/orders/${l.order_id}">Open order</a></td></tr>`).join('')}${posMissing.map(o => `<tr><td>${esc(o.po_number)}</td><td><i>Whole PO missing from their list</i> <span class="small">${esc(o.title)}</span></td><td class="num">${fmtN(D.O.get(o.id).outstanding)}</td><td><a href="#/orders/${o.id}">Open order</a></td></tr>`).join('')}</tbody></table></div>`;
  }
  if (probable.length) {
    html += `<div class="section-title"><h2>Matched by description</h2><span class="small">Their part number isn’t known yet, so these were paired by description and quantity on the same PO. Tick the ones that are right; their numbers get added to the part.</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>PO</th><th>Shipping has</th><th>App has</th><th class="num">Qty</th></tr></thead><tbody>${probable.map(r => `<tr><td><input type="checkbox" data-act="toggleProbable" data-v="${r.s.row}" ${C.acceptProbable.has(r.s.row) ? 'checked' : ''} aria-label="Same part"></td><td>${esc(r.s.po)}</td><td>${shipCell(r)}<div class="small">${esc(r.s.desc)}</div></td><td>${appCell(r)}</td><td class="num">${fmtN(r.s.qty)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  const upd = adds.length + staged.length + soChanges.length;
  html += `<div class="section-title"><h2>Updates from their list</h2><span class="spacer"></span>${upd ? `<button class="btn primary" data-act="applyShipping">Apply ${upd} update${upd > 1 ? 's' : ''}</button>` : ''}</div>`;
  html += upd ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Update</th><th>Details</th></tr></thead><tbody>
      ${adds.map(a => `<tr><td>Add part number</td><td><b>${esc(a.number)}</b> (${a.label === 'new' ? 'WET number' : 'client number'}) to ${esc(mainNo(a.r.line.part_id))} ${esc(partDesc(a.r.line.part_id))}</td></tr>`).join('')}
      ${hasStaged ? staged.map(r => `<tr><td>Staged quantity</td><td>${esc(r.s.po)} · ${esc(mainNo(r.line.part_id))}: ${fmtN(r.stagedChange.from) || 'none'} → <b>${fmtN(r.stagedChange.to) || 'none'}</b></td></tr>`).join('') : ''}
      ${soChanges.map(x => `<tr><td>WET SO number</td><td>${esc(x.o.po_number)}: ${esc(x.o.wet_so || 'none')} → <b>${esc(x.so)}</b></td></tr>`).join('')}
    </tbody></table></div>` : '<div class="tbl-wrap"><div class="empty">Nothing to update: numbers, SO numbers and staged quantities already agree.</div></div>';
  if (!hasStaged) html += '<p class="small">Staged quantities will show here once <code>supabase/fixes/2026-11-25-staged.sql</code> has been run.</p>';
  html += `<details class="allrows"><summary>All ${res.length} lines</summary><div class="tbl-wrap"><table class="tbl">${head}<tbody>${rowsHtml(res)}</tbody></table></div></details>`;
  exportable = { name: 'Shipping check', rows: res, cols: [
    { label: 'Result', text: r => SHIP_KIND[r.kind][1] + (r.probable ? ' (probable)' : '') }, { label: 'PO', text: r => r.s.po }, { label: 'WET SO', text: r => r.s.so },
    { label: 'Shipping item', text: r => r.s.item }, { label: 'Client #', text: r => r.s.wcs.map(w => w + 'WC').join(', ') }, { label: 'Shipping description', text: r => r.s.desc },
    { label: 'App part', text: r => r.line ? mainNo(r.line.part_id) : '' }, { label: 'Shipping pending', text: r => r.s.qty }, { label: 'App owed', text: r => r.line ? D.L.get(r.line.id).outstanding : '' },
    { label: 'Staged', text: r => r.s.staged || '' }, { label: 'Shipping remark', text: r => r.s.remark }] };
  return { title: 'Shipping check', sub: `${esc(C.fileName)} · ${esc(C.list.sheet)}`, tools: `<label class="btn small">${ICON.down}Choose another file…<input type="file" id="shipFile" accept=".xlsx" hidden></label>`, html };
};

async function loadShippingFile(file) {
  try {
    const list = parseShippingList(await readXlsx(file));
    ui.compare = { fileName: file.name, list, acceptProbable: new Set() };
  } catch (e) { console.error(e); ui.compare = { error: friendlyError(e) }; }
  if (route().view !== 'compare') go('#/compare'); else render();
}
document.addEventListener('change', e => { if (e.target.id === 'shipFile' && e.target.files[0]) loadShippingFile(e.target.files[0]); });
document.addEventListener('dragover', e => { if (route().view === 'compare') { e.preventDefault(); } });
document.addEventListener('drop', e => { if (route().view === 'compare' && e.dataTransfer.files[0]) { e.preventDefault(); loadShippingFile(e.dataTransfer.files[0]); } });

ACTIONS.toggleProbable = b => { const s = ui.compare.acceptProbable, k = +b.dataset.v; if (s.has(k)) s.delete(k); else s.add(k); render(); };
ACTIONS.applyShipping = () => {
  const { res, soChanges } = compareShipping(ui.compare.list);
  const C = ui.compare;
  const adds = []; const seen = new Set();
  for (const r of res) if (r.line && (!r.probable || C.acceptProbable.has(r.s.row))) for (const a of r.add) if (!seen.has(lc(a.number))) { seen.add(lc(a.number)); adds.push({ part_id: r.line.part_id, number: a.number, label: a.label, is_main: false }); }
  const staged = hasStaged ? res.filter(r => r.stagedChange) : [];
  confirmSheet('Apply updates from shipping?', `This adds <b>${adds.length}</b> part number${adds.length === 1 ? '' : 's'}, updates <b>${staged.length}</b> staged quantit${staged.length === 1 ? 'y' : 'ies'} and <b>${soChanges.length}</b> WET SO number${soChanges.length === 1 ? '' : 's'}. Quantities ordered are not changed. Everything shows in History.`, 'Apply', async () => {
    if (adds.length) await ins('part_numbers', adds);
    for (const r of staged) await upd('order_lines', r.line.id, { staged_qty: r.stagedChange.to || null, staged_date: todayISO() });
    for (const x of soChanges) await upd('orders', x.o.id, { wet_so: x.so });
    toast('Updated from shipping’s list');
  }, false);
};
