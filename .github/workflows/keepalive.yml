# Free Supabase projects pause after a quiet week. This asks the database the time once a day.
# It reads nothing private (keepalive() just returns now()). Runs on GitHub, costs nothing.
name: Keep Supabase awake
on:
  schedule:
    - cron: '23 4 * * *'   # 08:23 Dubai time, every day
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -sS --fail -X POST 'https://esyaxplcxvvtjdthidyu.supabase.co/rest/v1/rpc/keepalive' \
            -H 'apikey: sb_publishable_vlXiCn7sTkg0HgVt-1RaTQ_YAi0h2mU' \
            -H 'Content-Type: application/json' -d '{}'
